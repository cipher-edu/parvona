services:

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       parvona
      POSTGRES_USER:     parvona
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parvona"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── Django API ─────────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_HOST:                   db
      REDIS_URL:                 redis://redis:6379/0
      DJANGO_SETTINGS_MODULE:    config.settings.development
    volumes:
      - ./backend:/app
      - media_files:/app/media
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── Celery Worker ──────────────────────────────────────────────────────────
  celery_worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["celery", "-A", "config", "worker", "-l", "info", "-c", "2"]
    env_file:
      - ./backend/.env
    environment:
      DB_HOST:                db
      REDIS_URL:              redis://redis:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.development
      SKIP_SETUP:             "true"
    volumes:
      - ./backend:/app
    depends_on:
      - api

  # ─── Celery Beat ────────────────────────────────────────────────────────────
  celery_beat:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["celery", "-A", "config", "beat", "-l", "info"]
    env_file:
      - ./backend/.env
    environment:
      DB_HOST:                db
      REDIS_URL:              redis://redis:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.development
      SKIP_SETUP:             "true"
    volumes:
      - ./backend:/app
    depends_on:
      - api

  # ─── Telegram Bot ───────────────────────────────────────────────────────────
  telegram_bot:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["python", "manage.py", "run_telegram_bot"]
    env_file:
      - ./backend/.env
    environment:
      DB_HOST:                db
      REDIS_URL:              redis://redis:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.development
      SKIP_SETUP:             "true"
    volumes:
      - ./backend:/app
    depends_on:
      - api

volumes:
  postgres_data:
  media_files:
