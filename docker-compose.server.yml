services:

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-parvona}
      POSTGRES_USER:     ${POSTGRES_USER:-parvona}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-parvona}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      args:
        ENVIRONMENT: production
    restart: always
    ports:
      - "127.0.0.1:8031:8000"
    env_file:
      - ./backend/.env.prod
    environment:
      DB_HOST:                db
      REDIS_URL:              redis://:${REDIS_PASSWORD}@redis:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.production
    volumes:
      - /var/www/parvona-media:/app/media
      - /var/www/parvona-static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      args:
        ENVIRONMENT: production
    restart: always
    command: ["celery", "-A", "config", "worker", "-l", "warning", "-c", "4"]
    env_file:
      - ./backend/.env.prod
    environment:
      DB_HOST:                db
      REDIS_URL:              redis://:${REDIS_PASSWORD}@redis:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.production
      SKIP_SETUP:             "true"
    volumes:
      - /var/www/parvona-media:/app/media
    depends_on:
      - api

  celery_beat:
    build:
      context: ./backend
      args:
        ENVIRONMENT: production
    restart: always
    command: ["celery", "-A", "config", "beat", "-l", "warning", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    env_file:
      - ./backend/.env.prod
    environment:
      DB_HOST:                db
      REDIS_URL:              redis://:${REDIS_PASSWORD}@redis:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.production
      SKIP_SETUP:             "true"
    depends_on:
      - api

  telegram_bot:
    build:
      context: ./backend
      args:
        ENVIRONMENT: production
    restart: always
    command: ["python", "manage.py", "run_telegram_bot"]
    env_file:
      - ./backend/.env.prod
    environment:
      DB_HOST:                db
      REDIS_URL:              redis://:${REDIS_PASSWORD}@redis:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.production
      SKIP_SETUP:             "true"
    depends_on:
      - api

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: always
    ports:
      - "127.0.0.1:3031:80"
    volumes:
      - ./nginx.frontend.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  redis_data: