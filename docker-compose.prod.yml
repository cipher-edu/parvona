version: '3.9'

services:

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-parvona}
      POSTGRES_USER:     ${POSTGRES_USER:-parvona}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}        # must be set in .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-parvona}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ─── Django API ─────────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      args:
        ENVIRONMENT: production
    restart: always
    env_file:
      - ./backend/.env.prod
    environment:
      DB_HOST:                   db
      REDIS_URL:                 redis://:${REDIS_PASSWORD}@redis:6379/0
      DJANGO_SETTINGS_MODULE:    config.settings.production
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── Celery Worker ──────────────────────────────────────────────────────────
  celery_worker:
    build:
      context: ./backend
    restart: always
    command: ["celery", "-A", "config", "worker", "-l", "warning", "-c", "4"]
    env_file:
      - ./backend/.env.prod
    environment:
      DB_HOST:                db
      REDIS_URL:              redis://:${REDIS_PASSWORD}@redis:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.production
      SKIP_SETUP:             "true"
    depends_on:
      - api

  # ─── Celery Beat ────────────────────────────────────────────────────────────
  celery_beat:
    build:
      context: ./backend
    restart: always
    command: ["celery", "-A", "config", "beat", "-l", "warning", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    env_file:
      - ./backend/.env.prod
    environment:
      DB_HOST:                db
      REDIS_URL:              redis://:${REDIS_PASSWORD}@redis:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.production
      SKIP_SETUP:             "true"
    depends_on:
      - api

  # ─── Frontend build + Nginx ──────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    volumes:
      - frontend_dist:/usr/share/nginx/html

  nginx:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
      - media_files:/app/media:ro
      - static_files:/app/staticfiles:ro
      - /etc/letsencrypt/live/parvona.uz/fullchain.pem:/etc/ssl/certs/fullchain.pem:ro
      - /etc/letsencrypt/live/parvona.uz/privkey.pem:/etc/ssl/private/privkey.pem:ro
    depends_on:
      - api
      - frontend

volumes:
  postgres_data:
  redis_data:
  media_files:
  static_files:
  frontend_dist:
